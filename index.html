<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>まちあるきAIガイド</title>
  <link rel="stylesheet" href="style.css">

  <style>
    #map {
      width: 100%;
      height: 400px;
      background: #ddd;
      margin-top: 20px;
    }

    .setting {
      margin-top: 20px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 8px;
    }

    #distanceValue {
      font-weight: bold;
      color: blue;
      font-size: 20px;
    }
  </style>

</head>

<body>

<!-- ========================= -->
<!-- 起動画面 -->
<!-- ========================= -->

<div id="startPanel">

    <h1>旅つづき　Tabitsuzuki</h1>

<!-- ========================= -->
<!-- 言語選択 -->
<!-- ========================= -->

<div id="languageSelect">

    <p>Language / 言語</p>

    <button
        type="button"
        id="japaneseBtn"
        class="languageBtn selected"
    >
        🇯🇵 日本語
    </button>

    <button
        type="button"
        id="englishBtn"
        class="languageBtn"
    >
        🇺🇸 English
    </button>

</div>

<p id="purposeText">
    あなたの旅の目的を教えてください。
</p>

<button class="typeBtn" data-type="グルメ">
    🍴 <span id="foodText">グルメ</span>
</button>

<button class="typeBtn" data-type="癒し・リラックス">
    🌿 <span id="relaxText">癒し・リラックス</span>
</button>

<button class="typeBtn" data-type="歴史・文化探訪">
    🏯 <span id="historyText">歴史・文化探訪</span>
</button>

<button class="typeBtn" data-type="自然体験・アクティビティ">
    🚴 <span id="activityText">自然体験・アクティビティ</span>
</button>

<button id="startGuideBtn">
    ▶ <span id="startGuideText">ガイド開始</span>
</button>

</div>


<!-- ========================= -->
<!-- メイン画面 -->
<!-- ========================= -->

<h1>まちあるきAIガイド Ver1.1.1</h1>

<button id="toggleDebugBtn">
⚙
</button>

<div id="debugPanel">
  <div class="panel">

      <h3 id="distanceTitle">案内開始距離</h3>

      <input
          type="range"
          id="distanceSlider"
          min="20"
          max="800"
          step="20"
          value="500"
      >

<p>
    <span id="currentDistanceText">現在：</span>
    <span id="distanceValue">500</span>
    m
</p>

  </div>

  <div class="panel">

      <p id="status">

          待機中

      </p>

      <p id="nearestSpot">

          最寄りスポット：なし

      </p>

      <p id="stayTime">

          滞在時間：0秒

      </p>

  </div>
</div>

<div id="searchPanel">

    <div id="searchIcon">
        🧭
    </div>

<h2 id="searchTitle">
    探索中
</h2>

<p id="searchMessage">
    おすすめスポットを探しています
</p>

</div>

<!-- ========================= -->
<!-- ガイド -->
<!-- ========================= -->

<div id="guidePanel">

    <div id="spotInfo">

        <img id="spotImage">

        <h2 id="guideTitle"></h2>

        <p id="guideMessage"></p>

<button id="goBtn">
    🧭 <span id="goText">行ってみる</span>
</button>

<button id="ignoreBtn">
    ❌ <span id="ignoreText">ほかをみる</span>
</button>

    </div>

<button id="toggleSpotBtn">
    ▲ <span id="toggleSpotText">スポット情報を閉じる</span>
</button>

    <hr>

    <div id="chatHistory">

    </div>

    <div id="chatInput">

<h3>
    💬 AIコンシェルジュ
</h3>

<p class="chatDescription">
    気になることを自由に質問してください。
</p>

        <textarea
            id="question"
            rows="3"
            placeholder="例：御朱印はありますか？"
        ></textarea>

<button id="sendBtn">
    💬 <span id="sendText">質問する</span>
</button>

    </div>

</div>


<!-- ========================= -->
<!-- GoogleMapから戻った画面 -->
<!-- ========================= -->

<div id="resumeScreen" style="display:none;">

<h2>
    🧭 <span id="navigationTitle">ナビゲーション中</span>
</h2>

<p id="navigationMessage">
    Googleマップで目的地へ向かっています。
</p>

<p id="resumeMessage">
    現地に到着したら探索を再開してください。
</p>

<button id="resumeBtn">
    ▶ <span id="resumeText">探索を再開</span>
</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const japaneseBtn = document.getElementById("japaneseBtn");
const englishBtn = document.getElementById("englishBtn");

function changeLanguage(lang) {

    const isEnglish = lang === "en";

    document.documentElement.lang = isEnglish ? "en" : "ja";

    document.getElementById("purposeText").textContent =
        isEnglish
            ? "What are you looking for on your trip?"
            : "あなたの旅の目的を教えてください。";

    document.getElementById("foodText").textContent =
        isEnglish ? "Food & Drink" : "グルメ";

    document.getElementById("relaxText").textContent =
        isEnglish ? "Relaxation & Wellness" : "癒し・リラックス";

    document.getElementById("historyText").textContent =
        isEnglish ? "History & Culture" : "歴史・文化探訪";

    document.getElementById("activityText").textContent =
        isEnglish ? "Nature & Activities" : "自然体験・アクティビティ";

    document.getElementById("startGuideText").textContent =
        isEnglish ? "Start Guide" : "ガイド開始";

    japaneseBtn.classList.toggle("selected", !isEnglish);
    englishBtn.classList.toggle("selected", isEnglish);

document.getElementById("distanceTitle").textContent =
    isEnglish ? "Guide Trigger Distance" : "案内開始距離";

document.getElementById("currentDistanceText").textContent =
    isEnglish ? "Current:" : "現在：";

document.getElementById("searchTitle").textContent =
    isEnglish ? "Exploring" : "探索中";

document.getElementById("searchMessage").textContent =
    isEnglish
        ? "Looking for recommended spots nearby"
        : "おすすめスポットを探しています";

document.getElementById("goText").textContent =
    isEnglish ? "Take me there" : "行ってみる";

document.getElementById("ignoreText").textContent =
    isEnglish ? "Show me another" : "ほかをみる";

document.getElementById("toggleSpotText").textContent =
    isEnglish ? "Hide spot info" : "スポット情報を閉じる";

document.getElementById("conciergeTitle").textContent =
    isEnglish ? "AI Concierge" : "AIコンシェルジュ";

document.getElementById("chatDescription").textContent =
    isEnglish
        ? "Feel free to ask anything about this spot."
        : "気になることを自由に質問してください。";

document.getElementById("question").placeholder =
    isEnglish
        ? "e.g. Can I get a goshuin here?"
        : "例：御朱印はありますか？";

document.getElementById("sendText").textContent =
    isEnglish ? "Ask" : "質問する";

document.getElementById("navigationTitle").textContent =
    isEnglish ? "Navigating" : "ナビゲーション中";

document.getElementById("navigationMessage").textContent =
    isEnglish
        ? "Follow Google Maps to your destination."
        : "Googleマップで目的地へ向かっています。";

document.getElementById("resumeMessage").textContent =
    isEnglish
        ? "When you arrive, resume exploring."
        : "現地に到着したら探索を再開してください。";

document.getElementById("resumeText").textContent =
    isEnglish ? "Resume Exploring" : "探索を再開";
}

japaneseBtn.addEventListener("click", () => {
    changeLanguage("ja");
});

englishBtn.addEventListener("click", () => {
    changeLanguage("en");
});
</script>

<script src="main.js"></script>

</body>
</html>
